# ThreadsPulse 自動編譯（不含 Threads 本體）
#
# 產出：
#   ThreadsPulse sideload <版本>.zip   側載用（ThreadsPulse.dylib + ThreadsPulse.bundle + OpenThreadsSafariExtension.appex）
#   ThreadsPulse rootless <版本>.deb   無根越獄（Dopamine / palera1n rootless）
#   ThreadsPulse rootful <版本>.deb    有根越獄
#
# 觸發：
#   - 推送到 main／master、開 Pull Request、或在 Actions 頁面按「Run workflow」→ 檔案在該次執行的 Artifacts
#   - 推送 v 開頭的標籤（例如 v1.18.2）→ 另外自動建立 Release 並附上檔案
#
# 想直接得到注入好的 Threads IPA，請改用「Build IPA」workflow。

name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_VERSION: '16.5'   # 編譯用的 iOS SDK
  MIN_IOS: '15.0'       # 最低支援 iOS 版本

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.theos.outputs.version }}
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 Theos
        id: theos
        uses: ./.github/actions/setup-theos
        with:
          sdk-version: ${{ env.SDK_VERSION }}

      - name: 編譯
        env:
          VERSION: ${{ steps.theos.outputs.version }}
        run: |
          set -e
          MAKE="gmake FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:${MIN_IOS}"
          mkdir -p dist

          # 1) 無根越獄 .deb
          $MAKE clean
          $MAKE package THEOS_PACKAGE_SCHEME=rootless THEOS_PACKAGE_DIR=build/rootless
          cp build/rootless/*.deb "dist/ThreadsPulse rootless ${VERSION}.deb"

          # 2) 有根越獄 .deb（有根越獄的架構是 iphoneos-arm；只在這次編譯暫時替換，repo 裡的 control 不變）
          $MAKE clean
          cp control control.orig
          perl -pi -e 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm/' control
          $MAKE package THEOS_PACKAGE_DIR=build/rootful
          mv control.orig control
          cp build/rootful/*.deb "dist/ThreadsPulse rootful ${VERSION}.deb"

          # 3) 側載 zip（dylib + 語系 bundle + Safari 延伸功能）
          $MAKE -C OpenThreadsSafariExtension
          mkdir -p build/sideload
          cp .theos/obj/ThreadsPulse.dylib build/sideload/
          cp -R "layout/Library/Application Support/ThreadsPulse/ThreadsPulse.bundle" build/sideload/
          cp -R OpenThreadsSafariExtension/.theos/obj/OpenThreadsSafariExtension.appex build/sideload/
          (cd build/sideload && zip -qry "../../dist/ThreadsPulse sideload ${VERSION}.zip" \
              ThreadsPulse.dylib ThreadsPulse.bundle OpenThreadsSafariExtension.appex)

          ls -la dist

      - name: 上傳 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsPulse ${{ steps.theos.outputs.version }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載編譯結果
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThreadsPulse ${{ needs.build.outputs.version }}
          files: dist/*
